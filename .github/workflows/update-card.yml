name: Update profile card

on:
  schedule:
    - cron: "17 0 * * *" # daily, 07:17 Vietnam time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-card.yml"

permissions:
  contents: write

concurrency:
  group: update-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install font tooling
        run: pip install fonttools==4.55.3 brotli==1.1.0

      - name: Fetch stats
        env:
          # Optional PROFILE_TOKEN (a PAT with read:user) also counts private contributions.
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py "${{ github.repository_owner }}" data/stats.json

      - name: Render card
        run: python scripts/render_card.py data/stats.json assets/profile-card.svg

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/stats.json assets/profile-card.svg
          if git diff --cached --quiet; then
            echo "Card unchanged"
          else
            git commit -m "chore: refresh profile card"
            git push
          fi
